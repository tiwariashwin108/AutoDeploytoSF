        <lightning-input type="date" value={storeDateOfBirth} onchange={handleChangeBirth}

        class="slds-align_absolute-center"></lightning-button>

</lightning-card>

        {showSignToUser.sign}

        {showSignToUser.emoji}

        {showSignToUser.trait}
