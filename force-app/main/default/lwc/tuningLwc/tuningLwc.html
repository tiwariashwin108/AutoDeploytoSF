<template>
    <lightning-card title ="Custom look with tuning" >
        <lightning-record-edit-form
        record-id = {recordId}
        object-api-name ={objectApiName}
        >

        <lightning-messages></lightning-messages>

        <div class="slds-grid slds-wrap slds-p-around_small">
            <div class="slds-col slds-size_6-of-12">
                <lightning-input-field field-name ="Name"></lightning-input-field>
            </div>

            <div class="slds-col slds-size_6-of-12">
                <lightning-input-field field-name ="Phone"></lightning-input-field>
            </div>
        

        
            <div class="slds-col slds-size_6-of-12">
                <lightning-input-field field-name ="AlreadyNameSpac__Active__c"></lightning-input-field>
            </div>

            <div class="slds-col slds-size_6-of-12">
               <lightning-input-field field-name ="AlreadyNameSpac__Lat__c"></lightning-input-field>
            </div>
            
            <div  class="slds-align_absolute-center">
                <lightning-button type="submit" label="Save" class = "slds-m-around_small" variant="Brand"></lightning-button>
                <lightning-button type ="reset" label ="Reset" variant="destructive-text" ></lightning-button>
            </div>

        </div>
        </lightning-record-edit-form>
    </lightning-card>
</template>
